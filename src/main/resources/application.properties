spring.application.name=LatteList

# Credenciales privadas: crear src/main/resources/application-local.properties (NO se sube a git)
spring.config.import=optional:classpath:application-local.properties

spring.datasource.url=jdbc:mysql://localhost:3306/lattelist
spring.datasource.username=root
spring.datasource.password=
app.DatosDemo=false

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT (expiracion en milisegundos: 86400000 = 24 horas)
jwt.secret=${JWT_SECRET:latte-list-clave-secreta-de-desarrollo-cambiar-en-produccion-0123456789}
jwt.expiration=86400000

# Primer ADMIN que se crea al arrancar si todavia no existe
admin.email=admin@lattelist.com
admin.password=Admin1234